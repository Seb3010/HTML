        // ===========================================
        // === FUNCIONES DE LECTURA EN TIEMPO REAL ===
        // ===========================================

        // Helper para renderizar un comentario en HTML
        const renderComment = (commentData) => {
            const commentDiv = document.createElement('div');
            commentDiv.classList.add('comment');
            
            // Formatea la fecha y hora
            let formattedDate = 'justo ahora';
            if (commentData.timestamp && commentData.timestamp.seconds) {
                const date = new Date(commentData.timestamp.seconds * 1000);
                formattedDate = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + ' ' + date.toLocaleDateString('es-ES');
            }

            commentDiv.innerHTML = `
                <span class="comment-user">${commentData.usuario} (${formattedDate}):</span>
                <p class="comment-content">${commentData.contenido}</p>
            `;
            return commentDiv;
        };

        // Función para escuchar y mostrar comentarios en tiempo real
        const subscribeToComments = (postId) => {
            const commentsListElement = document.getElementById(`comments-list-${postId}`);
            const commentsRef = collection(db, "posts", postId, "comentarios");
            
            // Consulta: ordenar por timestamp descendente
            const q = query(commentsRef, orderBy("timestamp", "desc"));

            // Listener en tiempo real
            onSnapshot(q, (snapshot) => {
                commentsListElement.innerHTML = ''; // Limpiar lista
                
                snapshot.forEach((doc) => {
                    const commentData = doc.data();
                    const newCommentElement = renderComment(commentData);
                    commentsListElement.appendChild(newCommentElement);
