<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chismógrafo (Salón 4-A)</title>
    <link rel="stylesheet" href="styles/style_4-A.css">
    <script>
        const CLASE_ID = "salon_4-a"; 
    </script>
</head>
<body>
    <header>

        <article class="post" data-post-id="2"> 
            <h2>Título del chisme 2</h2>
            <p>Descripción del chisme 2</p>

            <div class="reactions-container">
                <button class="reaction-btn" data-reaction-type="like">👍 (<span class="count" id="like-count-2">0</span>)</button>
                <button class="reaction-btn" data-reaction-type="love">❤️ (<span class="count" id="love-count-2">0</span>)</button>
                <button class="reaction-btn" data-reaction-type="funny">😂 (<span class="count" id="funny-count-2">0</span>)</button>
            </div>
            
            <div class="comments-section">
                <h3>Comentarios</h3>
                <form class="comment-form">
                    <input type="text" placeholder="Escribe tu comentario..." required>
                    <button type="submit">Enviar</button>
                </form>
                <div class="comments-list" id="comments-list-2"></div>
            </div>
        </article>

        <article class="post" data-post-id="3"> 
            <h2>Título del chisme 3</h2>
            <p>Descripción del chisme 3</p>

            <div class="reactions-container">
                <button class="reaction-btn" data-reaction-type="like">👍 (<span class="count" id="like-count-3">0</span>)</button>
                <button class="reaction-btn" data-reaction-type="love">❤️ (<span class="count" id="love-count-3">0</span>)</button>
                <button class="reaction-btn" data-reaction-type="funny">😂 (<span class="count" id="funny-count-3">0</span>)</button>
            </div>
            
            <div class="comments-section">
                <h3>Comentarios</h3>
                <form class="comment-form">
                    <input type="text" placeholder="Escribe tu comentario..." required>
                    <button type="submit">Enviar</button>
                </form>
                <div class="comments-list" id="comments-list-3"></div>
            </div>
        </article>
        
    </section>

    <footer>
        <section>
            <a class="footer" href="#title">Ir al comienzo</a>
            <a class="footer" href="mailto:sebastianpdlp@outlook.com">Contactarme</a>
            <button id="Regresar" onclick="location.href='inicio.html'">Regresar</button>
        </section>
    </footer>

    <script type="module">
        // ==== IMPORTACIONES FIREBASE (sin cambios) ====
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { 
            getFirestore, collection, addDoc, doc, setDoc, deleteDoc, getDoc,
            query, orderBy, onSnapshot, where, serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

        // ==== CONFIGURACIÓN FIREBASE (sin cambios) ====
        const firebaseConfig = {
            apiKey: "AIzaSyDr1gdRN5eJEkTqgT-MMnvJnSqXs32IUTA",
            authDomain: "chismografo-8184b.firebaseapp.com",
            projectId: "chismografo-8184b",
            storageBucket: "chismografo-8184b.firebasestorage.app",
            messagingSenderId: "492422260287",
            appId: "1:492422260287:web:ceb2faa553856718223a8a",
            measurementId: "G-DNYGB4N2LZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==== ID de usuario (único por navegador) (sin cambios) ====
        if (!localStorage.getItem("userId")) {
            localStorage.setItem("userId", crypto.randomUUID());
        }
        const USER_ID = localStorage.getItem("userId");
        
        // 🚨 La variable CLASE_ID ahora está definida en el <head> y es global aquí

        // 🟢 FUNCIÓN DE RUTA: Define la colección de comentarios anidada por salón
        const getCommentsCollectionRef = (postId) => {
             // Ruta: salones/[CLASE_ID]/posts/[postId]/comentarios
            return collection(db, "salones", CLASE_ID, "posts", postId, "comentarios");
        }
        
        // 🟢 FUNCIÓN DE RUTA: Define la colección de reacciones anidada por salón
        const getReactionDocRef = (postId) => {
            // Document ID ÚNICO: [CLASE_ID]_[postId]_[userId]
            const reactionDocId = `${CLASE_ID}_${postId}_${USER_ID}`;
            return doc(db, "reacciones", reactionDocId);
        }
        
        // ==== Función para renderizar comentario (sin cambios) ====
        const renderComment = (commentData) => {
            const commentDiv = document.createElement('div');
            // ... (código anterior) ...
            
            let formattedDate = '';
            if (commentData.timestamp?.seconds) {
                const date = new Date(commentData.timestamp.seconds * 1000);
                formattedDate = `${date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })} ${date.toLocaleDateString('es-ES')}`;
            }

            const userSpan = document.createElement('span');
            userSpan.classList.add('comment-user');
            userSpan.innerHTML = `<strong>${commentData.usuario}</strong> (${formattedDate}):`;

            const contentP = document.createElement('p');
            contentP.classList.add('comment-content');
            contentP.textContent = commentData.contenido;

            commentDiv.appendChild(userSpan);
            commentDiv.appendChild(contentP);

            return commentDiv;
        };

        // ==== Escuchar comentarios en tiempo real (MODIFICADO) ====
        const subscribeToComments = (postId) => {
            const commentsList = document.getElementById(`comments-list-${postId}`);
            
            // 🟢 Usa la nueva función de ruta para comentarios
            const commentsRef = getCommentsCollectionRef(postId);
            
            const q = query(commentsRef, orderBy("timestamp", "desc"));

            onSnapshot(q, (snapshot) => {
                commentsList.innerHTML = '';
                snapshot.forEach((doc) => {
                    commentsList.appendChild(renderComment(doc.data()));
                });
            });
        };

        // ==== Escuchar reacciones en tiempo real (MODIFICADO) ====
        const subscribeToReactions = (postId) => {
            const reactionsRef = collection(db, "reacciones");
            
            // 🟢 Filtra por el postId Y el CLASE_ID para asegurar que solo cuentas reacciones de este salón
            const q = query(reactionsRef, where("postId", "==", postId), where("claseId", "==", CLASE_ID));

            onSnapshot(q, (snapshot) => {
                const counts = { like: 0, love: 0, funny: 0 };
                let userReaction = null;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (counts[data.tipo] !== undefined) counts[data.tipo]++;
                    if (data.userId === USER_ID) userReaction = data.tipo;
                });

                document.getElementById(`like-count-${postId}`).textContent = counts.like;
                document.getElementById(`love-count-${postId}`).textContent = counts.love;
                document.getElementById(`funny-count-${postId}`).textContent = counts.funny;

                const postEl = document.querySelector(`.post[data-post-id="${postId}"]`);
                postEl.querySelectorAll('.reaction-btn').forEach(btn => {
                    const type = btn.getAttribute('data-reaction-type');
                    btn.classList.toggle('active', type === userReaction);
                });
            });
        };

        // ==== Envío de comentarios (MODIFICADO) ====
        document.querySelectorAll('.comment-form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const postEl = form.closest('.post');
                const postId = postEl.dataset.postId;
                const input = form.querySelector('input');
                const text = input.value.trim();
                if (!text) return;

                try {
                    // 🟢 Usa la nueva función de ruta para comentarios
                    await addDoc(getCommentsCollectionRef(postId), {
                        contenido: text,
                        usuario: "Usuario Anónimo",
                        timestamp: serverTimestamp()
                    });
                    input.value = '';
                } catch (err) {
                    console.error("Error al enviar comentario:", err);
                }
            });
        });

        // ==== Manejo de reacciones (MODIFICADO) ====
        document.querySelectorAll('.reaction-btn').forEach(button => {
            button.addEventListener('click', async () => {
                const postEl = button.closest('.post');
                const postId = postEl.dataset.postId;
                const type = button.dataset.reactionType;
                
                // 🟢 Usa la nueva función de referencia
                const reactionRef = getReactionDocRef(postId); 

                try {
                    const snap = await getDoc(reactionRef);
                    
                    // 🟢 Añadir 'claseId' a los datos de la reacción
                    const reactionData = {
                        postId, 
                        userId: USER_ID, 
                        tipo: type, 
                        timestamp: serverTimestamp(),
                        claseId: CLASE_ID // ⬅️ CRÍTICO para el filtrado
                    };

                    if (snap.exists()) {
                        const currentType = snap.data().tipo;
                        if (currentType === type) {
                            await deleteDoc(reactionRef); // quitar reacción
                        } else {
                            await setDoc(reactionRef, reactionData);
                        }
                    } else {
                        await setDoc(reactionRef, reactionData);
                    }
                } catch (err) {
                    console.error("Error al manejar reacción:", err);
                }
            });
        });

        // ==== Inicializar escuchas (sin cambios) ====
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.post').forEach(post => {
                const id = post.dataset.postId;
                subscribeToComments(id);
                subscribeToReactions(id);
            });
        });
    </script>
</body>
</html>
